# ==============================================================================
# BashMenu Custom Keyboard Shortcuts (shortcuts.yml)
# ==============================================================================
# Configure custom direct key combos (e.g. "F10", "alt+t", "ctrl+g") and
# leader-key chords (e.g. "<leader> t", "<leader> g") to launch commands,
# scripts, editors, toast notifications, or interactive prompts.
#
# All target fields (action, command, script, file, message) support the full
# 6-tier BashMenu macro placeholder engine:
#   {bashmenu_dir}, {dev_dir}, {scripts_dir}, {home}, {env:VAR},
#   {param:prompt=...}, {file_picker:path=...}, {dir_picker}, {toast:3:"..."}
# ==============================================================================
leader_key: ctrl+space
leader_timeout_ms: 1500
show_leader_hint: true
shortcuts:
- key: <leader> t
  description: Interactive Shell
  type: command
  action: '{env:SHELL}'
  execution_mode: console
  quiet: true
  alt_buffer: false
- key: <leader> k
  description: KCChase Screensaver
  type: command
  action: kcchase
  command: kcchase
  execution_mode: console
  quiet: true
  alt_buffer: true
- key: <leader> g
  description: Git Status Summary
  type: command
  action: git -C {dev_dir} status -sb
  execution_mode: streaming
  window_percent: 60
- key: <leader> p
  description: Ping Target Host
  type: command
  action: ping -c 4 {param:prompt=Enter Host or IP:}
  execution_mode: streaming
  window_percent: 70
- key: <leader> e
  description: Browse & Edit File
  type: editor
  file: '{file_picker:path={bashmenu_dir}}'
  tabstop: 4
- key: <leader> i
  description: System Status Toast
  type: toast
  action: 'Host: {host} | IP: {localip} | Battery: {battery}'
  title: System Status
  timeout: 4.0
