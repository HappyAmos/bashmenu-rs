# ==============================================================================
# BashMenu Custom Keyboard Shortcuts (shortcuts.yml)
# ==============================================================================
# Configure built-in actions, direct key combos (e.g. "F1", "F10", "alt+t",
# "ctrl+g", "esc", "enter"), and leader-key chords (e.g. "<leader> t") to
# launch built-in tools, commands, scripts, editors, or toast notifications.
#
# Built-in action macros (type: builtin):
#   {help}, {theme_picker}, {text_editor}, {menu_editor}, {refresh},
#   {keys_toggle}, {user_gutter}, {theme_editor}, {shortcut_editor},
#   {back}, {select}, {toggle_gutter}
#
# Set `show_in_gutter: false` to keep a shortcut active without showing it in
# the main menu help gutter. Entries render in the exact order listed below.
# ==============================================================================
leader_key: ctrl+space
leader_timeout_ms: 1500
show_leader_hint: true
shortcuts:
- key: F1
  type: builtin
  action: '{help}'
- key: F2
  type: builtin
  action: '{theme_picker}'
- key: F3
  type: builtin
  action: '{text_editor}'
- key: F4
  type: builtin
  action: '{menu_editor}'
- key: F5
  type: builtin
  action: '{refresh}'
- key: F6
  type: builtin
  action: '{keys_toggle}'
- key: F7
  type: builtin
  action: '{user_gutter}'
- key: F8
  type: builtin
  action: '{theme_editor}'
- key: F9
  type: builtin
  action: '{shortcut_editor}'
- key: esc
  type: builtin
  action: '{back}'
- key: enter
  type: builtin
  action: '{select}'
  show_in_gutter: false
- key: ctrl+g
  type: builtin
  action: '{toggle_gutter}'
- key: <leader> t
  description: Interactive Shell
  type: command
  action: '{env:SHELL}'
  execution_mode: console
  quiet: true
  alt_buffer: false
- key: <leader> a
  description: Environment Info
  type: script
  action: '{env}'
  script: '{env}'
  execution_mode: console
  quiet: false
  alt_buffer: true
- key: <leader> k
  description: KCChase Screensaver
  type: command
  action: kcchase
  command: kcchase
  execution_mode: console
  quiet: true
  alt_buffer: true
- key: <leader> g
  description: Git Status Summary
  type: command
  action: git -C {dev_dir} status -sb
  execution_mode: streaming
  window_percent: 60
- key: <leader> p
  description: Ping Target Host
  type: command
  action: ping -c 4 {param:prompt=Enter Host or IP:}
  execution_mode: streaming
  window_percent: 70
- key: <leader> e
  description: Browse & Edit File
  type: editor
  file: '{file_picker:path={bashmenu_dir}}'
  tabstop: 4
- key: <leader> i
  description: System Status Toast
  type: toast
  action: 'Host: {host} | IP: {localip} | Battery: {battery}'
  title: System Status
  timeout: 4.0
