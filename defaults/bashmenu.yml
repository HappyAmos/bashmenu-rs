# ==============================================================================
# BashMenu Configuration (bashmenu.yml)
# All keys defined in this file can be referenced via placeholders using the
# '{app.<key>}' namespace (e.g. {app.theme}, {app.settings.tabstop}, {app.user.postal_code}),
# or shorthand shortcuts ({theme}, {user.<key>}, {settings.<key>}).
# ==============================================================================
version: "0.0.1"
theme: alaska-train
user:
  example_filepath: "{bashmenu_dir}"
  example_string: A string of text
  postal_code: ""
  example_boolean: true
settings:
  cache_dir: "{home}/.cache/bashmenu"
  check_for_updates: false
  templates_dir: "{bashmenu_dir}/templates"
  scripts_dir: "{bashmenu_dir}/scripts"
  ping_target: "1.1.1.1"
  toast_timeout: 2.0
  help_gutter_delay: 2.0
  tab_to_spaces: true
  tabstop: 4
  show_menu_shortcuts: true
  use_nerd_fonts: true
  nerd_font_width: auto
  status_gutter: "| Theme: {theme} | {user} | Battery: {battery} ({battery_stat}) | Version: {version} | {localip} | [b]{date_time_24_short}[/b]"
  inactivity_timeout:
    milliseconds: 300000
    command: ""
  refresh_interval: 10
  pager_editor: vim
  plugins:
    type: table
    width: 100%
    entries: 4
    headers: ""
    otd:
      script: otd.sh
      sleep: 3600
      standalone: true
      pretext: "{divider}"
      posttext: "{divider}"
  transition: blinds
  transition_speed: fast
  modal_animation: zoom
  modal_animation_speed: fast
  marquee_speed: normal
  framebuffer: auto
  locale: auto
