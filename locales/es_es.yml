  bmpager:
    usage: |-
      Uso: comando | bmpager [opciones]
           bmpager [opciones] <archivo> [archivo...]

      Paginador interactivo. Lee texto desde stdin o los archivos indicados y lo
      muestra pantalla por pantalla. Pulsa ESPACIO para la página siguiente, b para
      la anterior, flechas (o j/k) línea por línea y q para salir.

      Opciones:
        -h, --help        Mostrar esta ayuda y salir.
        -V, --version     Mostrar la versión y salir.
        -m, --markdown    Renderizar la entrada formateada como Markdown.
        -w, --wrap        Ajustar líneas de texto plano al ancho de la ventana.
        +N                Comenzar en la línea N arriba de la ventana.
        +/PATRÓN          Comenzar en la primera línea que contenga PATRÓN.
        -c, --no-color    Descartar secuencias ANSI en lugar de renderizarlas.
        --no-help         Omitir las pistas de atajos en la barra inferior.
        --no-file         No mostrar nombre de archivo ni permitir editarlo.
        --editor=MODO     Modo editor: 'default' ($EDITOR) o 'builtin' (BashEdit).
        --builtin-editor  Usar editor integrado (bashedit).
        --system-editor   Usar editor del sistema ($EDITOR / $VISUAL).
        --max-lines=N     Almacenar como máximo N líneas (predeterminado 1000000).
        --file=RUTA       Archivo asociado para abrir al editar flujos entubados.
        --reload-cmd=CMD  Comando para recargar tras editar flujos entubados.
        -l, --locale=LOC  Sobrescribir el código de idioma activo.

      Teclas:
        ABAJO j           Siguiente línea      ARRIBA k        Línea anterior
        ESPACIO f AvPág   Página siguiente     b RePág         Página anterior
        Ctrl-D            Media página abajo   Ctrl-U          Media página arriba
        g Inicio          Ir al INICIO         G Fin           Ir al FINAL
        /                 Buscar adelante      n / N           Coincidencia sig./ant.
        l o               Abrir enlace         e               Abrir en editor
        w W               Alternar ajuste      h ? F1          Manual de ayuda
        q Q Ctrl-C Esc    Salir
