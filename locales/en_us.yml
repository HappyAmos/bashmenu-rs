  themeedit:
    about: "Interactive visual theme editor with side-by-side token editing and multi-view previews"
    file: "Path to theme definition file"
    theme: "Name of specific theme to edit"
    local: "Load and save theme files in current working directory"
    locale: "Override interface display locale"
  ymlcheck:
    about: "YAML validator and schema linter for BashMenu"
    files: "Path to one or more YAML files to validate"
    themes: "Validate as a theme palette file (bashmenu.themes)"
    config: "Validate as a settings configuration file (bashmenu.yml)"
    menu: "Validate as a menu structure file (bashmenu.mnu)"
    shortcuts: "Validate as a custom keyboard shortcuts file (shortcuts.yml)"
    locale: "Validate as a translation locale string table (e.g. locales/es_es.yml)"
    yaml: "Validate YAML syntax only with no schema enforcement (default)"
  bmpager:
    usage: |-
      Usage: command | bmpager [options]
             bmpager [options] <file> [file...]

      Interactive pager. Text is read from stdin or from the named files, then
      displayed one screenful at a time. Press SPACE for the next page, b for
      the previous page, arrow keys (or j/k) for single lines, and q to quit.

      Options:
        -h, --help        Show this help and exit.
        -V, --version     Print the version and exit.
        -m, --markdown    Render input formatted as Markdown.
        -w, --wrap        Soft-wrap non-markdown text lines to window width.
        +N                Start with line N at the top of the window.
        +/PATTERN         Start at the first line containing PATTERN.
        -c, --no-color    Discard ANSI escape sequences instead of rendering them.
        --no-help         Omit the shortcut hints from the command bar.
        --no-file         Do not show filename badge or allow editing current file.
        --editor=MODE     Editor mode: 'default' ($EDITOR) or 'builtin' (BashEdit).
        --builtin-editor  Use built-in editor (bashedit).
        --system-editor   Use system default editor ($EDITOR / $VISUAL).
        --max-lines=N     Store at most N input lines (default 1000000).
        --file=PATH       Associated file path to open when editing piped streams.
        --reload-cmd=CMD  Command to refresh spool after editing piped streams.
        -l, --locale=LOC  Override active localization language code.

      Keys:
        DOWN j            Next line            UP k            Previous line
        SPACE f PgDn      Next page            b PgUp          Previous page
        Ctrl-D            Half page down       Ctrl-U          Half page up
        g Home            Jump to TOP          G End           Jump to BOT
        /                 Search forward       n / N           Next / prev match
        l o               Follow / open link   e               Open in editor
        w W               Toggle soft-wrap     h ? F1          Help manual modal
        q Q Ctrl-C Esc    Quit
