    image: "Render full-resolution TrueColor background images directly via framebuffer"
    locale: "Override active locale (e.g. \"en_US\", \"es_ES\", or path to YAML locale file)"
  bashedit:
    about: "Terminal text editor with crash recovery, tabs, and colocated swap files"
    file: "File to edit (leave blank for empty unsaved buffer)"
    read_only: "Open in read-only mode"
    tabstop: "Tab stop width (spaces per tab)"
    show_whitespace: "Display visible glyphs for space and tab characters"
    wrap: "Soft-wrap long lines to fit terminal viewport"
    tab_to_spaces: "Convert tab keypresses to spaces instead of raw tab characters"
    line: "Initial line number to jump to"
    theme: "Theme override name"
    local: "Load and save configuration files in current working directory"
    locale: "Override active locale (e.g. \"en_US\", \"es_ES\", or path to YAML locale file)"
  menuedit:
    about: "Interactive visual menu editor with side-by-side tree and property inspector"
    file: "Path to menu definition file"
    local: "Load and save menu files in current working directory"
    select_path: "Selected item path (comma-separated indices, e.g. \"0,2\")"
    select_title: "Selected item label or title to focus"
    title_chain: "Hierarchical title chain for deep node resolution (comma or > separated)"
    shortcuts: "Launch in Keyboard Shortcuts editor mode (shortcuts.yml)"
    merge: "Interactively merge a user menu with an upstream vanilla template"
    user_menu: "User menu file for merge mode (defaults to user's bashmenu.mnu)"
    vanilla_menu: "Vanilla / upstream template menu file for merge mode"
    output_menu: "Destination file for merged menu (defaults to user_menu)"
    backup: "Create a backup file at this path before writing merged menu"
