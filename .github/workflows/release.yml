name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            apt_packages: ""
            linker: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            apt_packages: musl-tools
            linker: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            apt_packages: gcc-aarch64-linux-gnu
            linker: aarch64-linux-gnu-gcc
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Build Release Binaries
        run: |
          if [ -n "${{ matrix.linker }}" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER="${{ matrix.linker }}"
          fi
          cargo build --release --workspace --target ${{ matrix.target }}

      - name: Package Release Bundle
        run: |
          TAG="${GITHUB_REF_NAME:-snapshot}"
          PKG_NAME="bashmenu-rs-${TAG}-${{ matrix.target }}"
          mkdir -p "${PKG_NAME}/bin"

          # Copy all 8 workspace binaries
          cp "target/${{ matrix.target }}/release/bashmenu" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/ymlcheck" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/menuedit" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/shortcutedit" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/themeedit" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/bashedit" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/bmpager" "${PKG_NAME}/bin/"
          cp "target/${{ matrix.target }}/release/cheat" "${PKG_NAME}/bin/"
          (cd "${PKG_NAME}/bin" && ln -sf bashmenu bm)

          # Copy configurations, scripts, assets, and documentation
          cp -r locales "${PKG_NAME}/"
          cp -r assets "${PKG_NAME}/"
          cp -r defaults "${PKG_NAME}/"
          cp -r scripts "${PKG_NAME}/"
          cp install.sh "${PKG_NAME}/"
          cp uninstall.sh "${PKG_NAME}/"
          cp README.md "${PKG_NAME}/"
          cp LICENSE "${PKG_NAME}/"
          cp TRANSLATIONS.md "${PKG_NAME}/"

          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-${{ matrix.target }}
          path: |
            bashmenu-rs-*.tar.gz
            bashmenu-rs-*.tar.gz.sha256

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Generate Combined Checksums
        run: |
          sha256sum bashmenu-rs-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            bashmenu-rs-*.tar.gz
            bashmenu-rs-*.tar.gz.sha256
            SHA256SUMS.txt
