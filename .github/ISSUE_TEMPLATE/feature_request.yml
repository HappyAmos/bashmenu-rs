name: Feature Request
description: Suggest a new idea, enhancement, theme, or translation for BashMenu-RS
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement for BashMenu-RS! We welcome ideas that improve the user experience while respecting our design principles (instant startup, zero runtime dependencies, and terminal state safety).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement or Use Case
      description: Is your feature request related to a problem or missing workflow?
      placeholder: I am always frustrated when... or It would be helpful if...
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution or Behavior
      description: Describe what you would like to see happen and how it should look or function in the terminal.
      placeholder: Describe the proposed command, TUI widget, shortcut, or configuration setting...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, mockup screenshots, or references here.
    validations:
      required: false
