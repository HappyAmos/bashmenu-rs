[workspace]
members = [
    "crates/bashmenu-core",
    "crates/bashmenu-tui",
    "crates/bashmenu-cli",
    "crates/ymlcheck-cli",
    "crates/themeedit-cli",
    "crates/menuedit-cli",
    "crates/bashedit-cli",
    "crates/bmpager-cli",
    "crates/cheat-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.11"
edition = "2021"
license = "MIT"
authors = ["Andrew <happyamos-rs@anglernook.com>"]
repository = "https://github.com/HappyAmos/bashmenu-rs"

[workspace.dependencies]
bashmenu-core = { path = "crates/bashmenu-core" }
bashmenu-tui = { path = "crates/bashmenu-tui" }

# TUI & Terminal
ratatui = "0.30"
crossterm = { version = "0.29", features = ["use-dev-tty"] }
vt100 = "0.18"

# Serialization & Data
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "2.2"
serde_json = { version = "1.0", features = ["preserve_order"] }

# Markdown
pulldown-cmark = { version = "0.13", default-features = false }

# CLI & Formatting
clap = { version = "4.5", features = ["derive"] }
unicode-width = "0.2"
regex = "1.11"
thiserror = "2.0"
anyhow = "1.0"
libc = "0.2"
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
resvg = { version = "0.50", default-features = false, features = ["svgz", "text", "system-fonts"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }

